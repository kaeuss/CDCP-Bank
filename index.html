<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDCP Data Centre Professional Quiz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-indigo: #4f46e5;
            --accent-indigo-hover: #4338ca;
            --success: #10b981;
            --error: #f43f5e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .stats-container {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .stat-box {
            background: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-weight: 500;
        }

        .toggle-btn {
            background: var(--accent-indigo);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .toggle-btn:hover {
            background: var(--accent-indigo-hover);
        }
        
        .reset-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            color: var(--text-main);
            background: var(--card-bg);
        }

        /* Main Content */
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .question-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.2rem;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option:not(.disabled):hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--text-muted);
        }

        .option.selected-correct {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .option.selected-incorrect {
            background: rgba(244, 63, 94, 0.1);
            border-color: var(--error);
            color: var(--error);
        }

        .option.reveal-correct {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .option.disabled {
            cursor: default;
            opacity: 0.9;
        }

        .explanation {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.2);
            border-left: 4px solid var(--accent-indigo);
            border-radius: 4px;
            font-size: 0.95rem;
            color: var(--text-muted);
            display: none;
        }

        .explanation.visible {
            display: block;
            animation: fadeIn 0.3s ease;
            -webkit-animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @-webkit-keyframes fadeIn {
            from { opacity: 0; -webkit-transform: translateY(-5px); }
            to { opacity: 1; -webkit-transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .stats-container {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">CDCP Knowledge Check</div>
        <div class="stats-container">
            <div class="stat-box">Score: <span id="score">0</span> / <span id="total">0</span></div>
            <button class="toggle-btn" id="modeToggle" type="button">Enable Study Mode</button>
            <button class="reset-btn" id="resetBtn" type="button">Reset Progress</button>
        </div>
    </header>

    <main id="quiz-container">
        <!-- Questions will be dynamically injected here -->
    </main>

    <script>
        // Global error handler to show errors on screen for iOS debugging
        window.onerror = function(msg, url, line) {
            document.getElementById('quiz-container').innerHTML = 
                `<div style="color:#f43f5e; padding:20px; background:#1e293b; border-radius:8px; border:1px solid #f43f5e; margin:20px;">
                    <strong>Application Error:</strong><br>${msg}<br>Line: ${line}
                </div>`;
            return false;
        };

        const questions = [
            { id: 1, q: "Generator fuel storage tanks need to be installed. Location wise, where do you install the fuel tanks?", opts: ["Underground", "Above ground", "Regulations depending", "Building rooftop"], ans: 2, exp: "Fuel storage location is heavily dependent on local regulations, zoning laws, and environmental codes." },
            { id: 2, q: "What is the minimum height of the raised floor?", opts: ["100 cm (40\", 3.3 ft.)", "80 cm (32\", 2.6 ft.)", "40 cm (16\", 1.3 ft.)", "60 cm (24\", 2 ft.)"], ans: 2, exp: "According to standard CDCP curriculum, 40 cm (16 inches) is the established minimum height for a raised floor to ensure adequate airflow distribution and sufficient space for cable routing." },
            { id: 3, q: "Which of the below statements is correct?", opts: ["THDi does not create THDv", "THDv does not create THDi", "THDi creates THDv", "THDv creates THDi"], ans: 2, exp: "Total Harmonic Distortion of Current (THDi) drawn by non-linear loads causes voltage distortion (THDv) as it flows through the system impedance." },
            { id: 4, q: "According to the NRCP standard, what maximum EMF exposure levels towards humans?", opts: ["1 mG", "10 μΤ", "37.5 mG", "10 mG"], ans: 3, exp: "The standard recommends limiting human exposure to electromagnetic fields to a maximum of 10 mG (milligauss)." },
            { id: 5, q: "No need for a controlled environment is a characteristic of which type of UPS?", opts: ["VFI Class UPS", "Static UPS", "Dynamic UPS", "VI Class UPS"], ans: 2, exp: "Dynamic (rotary) UPS systems are highly robust and generally do not require strictly controlled environmental conditions like static, battery-heavy UPS systems do." },
            { id: 6, q: "From the list below, which UPS has the lowest classification based on IEC-62040?", opts: ["True online double conversion (VFI)", "High frequency transformerless (VFI)", "Delta conversion (VI)", "VFD"], ans: 3, exp: "VFD (Voltage and Frequency Dependent), also known as offline or standby, provides the lowest level of protection." },
            { id: 7, q: "A company located in poor quality power region... Management decides to replace the UPS. Which type UPS suitable for A company?", opts: ["Eco-mode", "Enhanced Eco-mode", "Smart mode", "True online double conversion"], ans: 3, exp: "For a mission-critical facility in a poor power quality region, a True Online Double Conversion (VFI) UPS provides the highest protection by completely isolating the load from raw utility power." },
            { id: 8, q: "For safety purposes, you ask a contractor to install signage indicating escape routes. Where do these signs need to be installed?", opts: ["Due to distance, only at places further away from the exit door", "Only in the computer room", "At every exit door", "As per your discretion"], ans: 2, exp: "Safety regulations mandate that illuminated or clear exit signage must be installed at every exit door." },
            { id: 9, q: "Current flow through ( ) paths/path, the conductor with the ( ) resistance will carry the ( ) current.", opts: ["all; lower; most", "all; higher; most", "no; lower; most", "two; lower; less"], ans: 0, exp: "Current flows through all available paths. According to Ohm's Law, the path with lower resistance allows the most current to pass." },
            { id: 10, q: "In EMF, the IEC 61000-4-8 standard is discussing maximum levels towards", opts: ["Humans", "Neither humans nor equipment", "Equipment", "Humans and equipment"], ans: 2, exp: "IEC 61000-4-8 relates to electromagnetic compatibility (EMC) and immunity requirements for equipment." },
            { id: 11, q: "Considering light in the data centre, what is the ideal rack colour?", opts: ["Red", "Black", "White", "Grey"], ans: 2, exp: "White racks reflect light better, reducing the amount of lighting needed and thereby saving energy." },
            { id: 12, q: "A Signal Reference Grid (SRG) provides a ( ) for ( ) to dissipate before they cause breakdown of equipment.", opts: ["low impedance path; low frequency noise currents", "low impedance path; high frequency noise currents", "high impedance path; high frequency noise currents", "high impedance path; low frequency noise currents"], ans: 1, exp: "An SRG creates an equipotential plane that provides a low impedance path specifically for high-frequency noise currents." },
            { id: 13, q: "An Automatic Transfer Switch (ATS) is?", opts: ["Transfer from prime power source to alternate power source in the event of prime power source interruption.", "Transfer from battery bank to UPS...", "Transfer from Cooling unit to another...", "Transfer from primary network to alternate network..."], ans: 0, exp: "An ATS is designed to automatically transfer electrical loads from a primary power source to a backup (alternate) source when the primary fails." },
            { id: 14, q: "Management decides to replace the vented cell battery. Which type battery suitable for A company?", opts: ["Sealed Lead Acid (SLA)", "Lithium-Ion (Li-ion)", "Nickel-Cadmium (Ni-Cd)", "Valve Regulated Lead Acid (VRLA)"], ans: 3, exp: "VRLA (Valve Regulated Lead Acid) is the standard, safer replacement for vented (flooded) cell batteries to prevent off-gassing issues." },
            { id: 15, q: "Which room or area in a data centre is defined as the space where equipment is acclimated, inspected, configured, and tested to ensure it is ready for deployment?", opts: ["Holding Area", "Media Room", "Staging Area", "Computer Room"], ans: 2, exp: "The Staging Area (or Build Room) is used to unpack, test, and configure equipment before moving it to the production floor (Computer Room)." },
            { id: 16, q: "The recommended unit of measure for light is?", opts: ["Lumen", "Lux", "Bright", "Rays"], ans: 1, exp: "Lux is the recommended unit as it measures illuminance (the amount of light that actually hits the surface)." },
            { id: 17, q: "Light fixtures should be installed", opts: ["Only in aisles or rack rows where ICT equipment is deployed.", "On top of each rack.", "Only at the back of aisles", "In all aisles"], ans: 3, exp: "Lighting should be uniform and installed in all aisles (hot and cold) to ensure safe operational and maintenance conditions." },
            { id: 18, q: "Electronic, fast switching - is a characteristic of?", opts: ["On/Off Switch", "Static Transfer Switch (STS)", "Automatic Transfer Switch (ATS)", "Emergency Switch"], ans: 1, exp: "An STS uses solid-state electronics (thyristors/SCRs) to switch between power sources almost instantaneously (typically 4-16ms)." },
            { id: 19, q: "You want to purchase a UPS which offers you a maintenance bypass mode. Which UPS technology are you looking for?", opts: ["Offline/Standby UPS", "Zero Online Double Conversion UPS", "Line Interactive UPS", "True Online Double Conversion UPS"], ans: 3, exp: "True Online Double Conversion UPS architectures structurally include internal and external maintenance bypass paths for servicing without dropping the load." },
            { id: 20, q: "For a data centre to have control over quality and quantity of water, what is the ideal storage option?", opts: ["Well water", "Water storage tank", "Retention pond", "Artificial lake"], ans: 1, exp: "Dedicated water storage tanks give a facility precise control over reserve capacity and water treatment quality." },
            { id: 21, q: "In a data centre, the ground resistance should be?", opts: ["Less than 0.58 Ohm", "Less than 1.0 Ohm", "Less than 1.22 Ohm", "Less than 1.5 Ohm"], ans: 1, exp: "Telecommunications standards generally mandate that grounding resistance in a data centre be less than 1.0 Ohm." },
            { id: 22, q: "You are assessing a building for potential data centre use... which floor would be the most suitable for constructing the data centre?", opts: ["Basement", "Ground Floor", "Level 1", "Level 2"], ans: 2, exp: "Level 1 is generally preferred because it significantly mitigates the risks of flooding and vehicle impact associated with the Basement or Ground Floor, while still making it relatively easy to move heavy equipment compared to higher levels." },
            { id: 23, q: "Which load is applied over the entire area of the floor panel / tile?", opts: ["Uneven Load (UL)", "Uniformly Distributed Load (UDL)", "Concentrated Load / Point Load", "Rolling Load (RL)"], ans: 1, exp: "A Uniformly Distributed Load (UDL) refers to weight spread evenly across a given surface area." },
            { id: 24, q: "Which type of rack provides excellent cooling capabilities?", opts: ["Glass door based rack", "Meshed door based rack", "Grated door based rack", "Perforated door based rack"], ans: 1, exp: "Meshed doors provide excellent cooling capabilities by allowing maximum airflow through the rack, which is critical for maintaining proper operating temperatures for IT equipment." },
            { id: 25, q: "W (Watt) = VA (Volt Ampere) ( ) PF (Power Factor)", opts: ["+", "-", "*", "/"], ans: 2, exp: "Real power (Watts) is calculated by multiplying Apparent Power (VA) by the Power Factor (PF)." },
            { id: 26, q: "You want to connect several buildings, distance between each building is approximately 1.2 kilometres. Which fibre cable do you choose?", opts: ["Single mode", "Multi-mode", "Mixed mode", "None of the above"], ans: 0, exp: "Single-mode fiber is required for distances exceeding the typical limits of multi-mode fiber (usually around 300-550m depending on the standard)." },
            { id: 27, q: "You are installing network copper cabling. What is the maximum distance supported (cat8 excluded)?", opts: ["90 metres", "10 metres", "3 kilometres", "100 metres"], ans: 3, exp: "Standard Ethernet over twisted pair copper supports a maximum channel length of 100 metres (90m permanent link + 10m patch cords)." },
            { id: 28, q: "Which type of battery requires a management system to prevent unsafe temperatures during charging/discharging?", opts: ["Sealed Lead Acid (SLA)", "Lithium-Ion (Li-ion)", "Nickel-Cadmium (Ni-Cd)", "Flooded cell"], ans: 1, exp: "Lithium-Ion batteries require a stringent Battery Management System (BMS) to monitor cell voltages and prevent thermal runaway." },
            { id: 29, q: "Which distribution is flexible electrical cabling for Rack?", opts: ["Standard cabling", "Busbar trunking", "Wireless", "Sealing"], ans: 1, exp: "Overhead busbar trunking systems with tap-off boxes provide highly flexible, modular electrical distribution to racks." },
            { id: 30, q: "What is recommended as the maximum cable length for the flexible copper cables (patch chords) which connects the ICT equipment to the network infrastructure?", opts: ["2 metres / 6.5 feet", "10 metres / 33 feet", "90 metres / 295 feet", "120 metres / 394 feet"], ans: 1, exp: "Within a 100m total channel, a maximum of 10 metres is allocated for patch cords (equipment and cross-connect)." },
            { id: 31, q: "When referring to the internal mounting space in racks... What is the height of 1 'U' or 'RU'?", opts: ["19 inches (60 cm)", "24 inches (80 cm)", "1.752 inches (44.45 mm)", "3.5 inches (8.59 cm)"], ans: 2, exp: "One Rack Unit (1U) is standardized at exactly 1.75 inches (44.45 mm) in height." },
            { id: 32, q: "What is the purpose of deploy blanking panels?", opts: ["Reserve the space for future deployment", "Separate hot and cold air", "Prevent sabotage", "Proper cabling management"], ans: 1, exp: "Blanking panels prevent bypass airflow, stopping cold air from mixing with hot exhaust air through empty rack spaces." },
            { id: 33, q: "Installing a self-contained cooling rack, you wish to make use of a coolant safe for both equipment and humans. Which do you select?", opts: ["Water based", "Refrigerant based", "Liquid CO2 based", "None of the above"], ans: 1, exp: "Pumped refrigerants are commonly used as they change to a non-damaging gas if a leak occurs, protecting the IT equipment." },
            { id: 34, q: "The computer room has no space to store the cylinders... needs to be location in a room 20-30 meters away. Which fire suppression system is recommended?", opts: ["FM 200", "Novec 1230", "Halon", "Inergen"], ans: 3, exp: "Inergen is stored at very high pressure, allowing the cylinders to be placed much further away from the discharge nozzles." },
            { id: 35, q: "You wish to contain a small area in the computer room. Which aisle containment concept do you install?", opts: ["Hot aisle containment", "Cold aisle containment", "Both containment concept is not acceptable", "Gas containment"], ans: 1, exp: "Cold aisle containment is generally easier to retrofit and isolate specific, smaller zones or single aisles." },
            { id: 36, q: "Selecting a fire suppression agent/gas, you wish to make use of a suppression agent which is very environmentally friendly. Which do you choose?", opts: ["Halon 1301", "FM 200", "Argonite IG55", "Novec 1230"], ans: 2, exp: "Argonite IG55 is extremely environmentally friendly as it is an inert gas blend of 50% Argon and 50% Nitrogen, both naturally occurring in the atmosphere, resulting in zero Ozone Depletion Potential (ODP) and zero Global Warming Potential (GWP)." },
            { id: 37, q: "What is the primary reason for installing a monitoring system in the data centre?", opts: ["To be able to collect data for capacity planning", "To notice abnormalities early so that actions can be taken to avoid disasters", "To implement automated change management", "To create a proper asset database"], ans: 1, exp: "While data collection is a benefit, the primary goal of environmental and power monitoring is early warning to prevent catastrophic failure." },
            { id: 38, q: "Before deciding on the purchase... you perform a risk assessment. What is the logical formula for risk?", opts: ["Risk = Impact * Probability", "Risk = Impact / Probability", "Risk = Impact - Probability", "Risk = Impact + Probability"], ans: 0, exp: "Risk is classically calculated as the Impact (or severity) of an event multiplied by its Probability of occurring." },
            { id: 39, q: "In fire protection, 'using a light source and a photocell' is a characteristic of which type of fire detection system?", opts: ["VESDA", "HSSD", "Ionization detector", "Photoelectric detector"], ans: 3, exp: "Photoelectric smoke detectors use a light beam and a photocell receiver to detect smoke particles scattering the light." },
            { id: 40, q: "Which of the below describes Watt's Law?", opts: ["P = I / V", "P = V + I", "P = I * V", "P = V - 1"], ans: 2, exp: "Watt's Law states that Power (P) equals Current (I) multiplied by Voltage (V)." },
            { id: 41, q: "A Signal Reference Grid (SRG) provides shielding for?", opts: ["Low frequencies noise currents", "EMF from power cables", "Grounding of equipment", "High frequencies noise currents"], ans: 3, exp: "An SRG creates a low-impedance equipotential plane specifically designed to dissipate high-frequency noise currents." },
            { id: 42, q: "Using a fire handheld extinguisher in the data centre, which class of fire must it address?", opts: ["Class D", "Class C", "Class E", "Class A"], ans: 1, exp: "In standard classifications commonly used for data centres, Class C refers to electrical fires, which are the primary concern for handheld extinguishers in this environment." },
            { id: 43, q: "Based on the raised floor cooling concept you place the air-conditioners perpendicular to the aisle. What is the preferred location?", opts: ["Cold aisle", "Hot aisle", "Both cold and hot aisle", "Any position will do"], ans: 1, exp: "CRAC/CRAH units are ideally placed perpendicular to the hot aisles so they directly pull in the hot return air." },
            { id: 44, q: "The data centre wants to put an automated monitoring system in place but the senior management is only willing to make little budget available. Which system do you consider purchasing?", opts: ["NMS - Network Monitoring System", "BMS - Building Management System", "DCIM - Data Centre Infrastructure Management System", "EMS - Environmental Monitoring System"], ans: 3, exp: "An Environmental Monitoring System (EMS) is generally more cost-effective and focused strictly on environmental parameters compared to comprehensive BMS or DCIM systems." },
            { id: 45, q: "A dual source static switch (STS) is considered to be a?", opts: ["Make before break switch", "Break before make switch", "0 second transfer switch", "Safety switch which activates on high earth leakage"], ans: 1, exp: "An STS is a 'break before make' switch to ensure the two power sources are never paralleled or connected together during the transfer." }
        ];

        let state = { answers: {}, score: 0 };
        let isStudyMode = false;
        let randomizedQuestions = [];

        const container = document.getElementById('quiz-container');
        const scoreEl = document.getElementById('score');
        const totalEl = document.getElementById('total');
        const modeBtn = document.getElementById('modeToggle');
        const resetBtn = document.getElementById('resetBtn');

        function init() {
            totalEl.innerText = questions.length;
            loadState();
            randomizedQuestions = [...questions].sort(() => Math.random() - 0.5);
            renderQuiz();
            updateScoreDisplay();
        }

        // Extremely safe storage functions for iOS compatibility
        function loadState() {
            try {
                if (typeof window.localStorage !== 'undefined') {
                    const saved = window.localStorage.getItem('cdcp_quiz_state');
                    if (saved) {
                        state = JSON.parse(saved);
                    }
                }
            } catch (e) {
                console.warn('LocalStorage access blocked by iOS environment.');
            }
        }

        function saveState() {
            try {
                if (typeof window.localStorage !== 'undefined') {
                    window.localStorage.setItem('cdcp_quiz_state', JSON.stringify(state));
                }
            } catch (e) {
                // Ignore gracefully on iOS
            }
        }

        function resetState() {
            if(confirm("Are you sure you want to clear your progress?")) {
                try {
                    if (typeof window.localStorage !== 'undefined') {
                        window.localStorage.removeItem('cdcp_quiz_state');
                    }
                } catch (e) {}
                state = { answers: {}, score: 0 };
                isStudyMode = false;
                modeBtn.innerText = "Enable Study Mode";
                init();
            }
        }

        function renderQuiz() {
            container.innerHTML = '';
            
            randomizedQuestions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-${q.id}`;
                
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${q.q}`;
                card.appendChild(qText);

                const optsGrid = document.createElement('div');
                optsGrid.className = 'options-grid';

                const hasAnswered = state.answers.hasOwnProperty(q.id);
                const answeredIndex = state.answers[q.id];

                q.opts.forEach((optText, optIndex) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option';
                    optDiv.innerText = optText;

                    if (hasAnswered) {
                        optDiv.classList.add('disabled');
                        if (optIndex === q.ans) optDiv.classList.add('reveal-correct');
                        if (optIndex === answeredIndex && answeredIndex !== q.ans) optDiv.classList.add('selected-incorrect');
                    } else if (isStudyMode && optIndex === q.ans) {
                        optDiv.classList.add('reveal-correct');
                        optDiv.classList.add('disabled');
                    }

                    if (!hasAnswered && !isStudyMode) {
                        const handleInteraction = (e) => {
                            e.preventDefault();
                            handleSelection(q.id, optIndex, optDiv, optsGrid, expDiv, q.ans);
                        };
                        optDiv.addEventListener('click', handleInteraction);
                        optDiv.addEventListener('touchend', handleInteraction, { passive: false });
                    }

                    optsGrid.appendChild(optDiv);
                });

                card.appendChild(optsGrid);

                const expDiv = document.createElement('div');
                expDiv.className = 'explanation';
                expDiv.innerHTML = `<strong>Explanation:</strong> ${q.exp}`;
                
                if (hasAnswered || isStudyMode) {
                    expDiv.classList.add('visible');
                }

                card.appendChild(expDiv);
                container.appendChild(card);
            });
        }

        function handleSelection(qId, selectedIdx, optDiv, grid, expDiv, correctIdx) {
            if (state.answers.hasOwnProperty(qId)) return;

            state.answers[qId] = selectedIdx;
            
            const options = grid.querySelectorAll('.option');
            options.forEach((opt, idx) => {
                opt.classList.add('disabled');
                const newOpt = opt.cloneNode(true);
                opt.parentNode.replaceChild(newOpt, opt);
                
                if (idx === correctIdx) {
                    newOpt.classList.add('selected-correct');
                } else if (idx === selectedIdx) {
                    newOpt.classList.add('selected-incorrect');
                }
            });

            expDiv.classList.add('visible');

            if (selectedIdx === correctIdx) {
                state.score++;
                updateScoreDisplay();
            }

            saveState();
        }

        function updateScoreDisplay() {
            scoreEl.innerText = state.score;
        }

        const toggleHandler = (e) => {
            e.preventDefault();
            isStudyMode = !isStudyMode;
            modeBtn.innerText = isStudyMode ? "Disable Study Mode" : "Enable Study Mode";
            renderQuiz();
        };

        modeBtn.addEventListener('click', toggleHandler);
        modeBtn.addEventListener('touchend', toggleHandler, { passive: false });

        const resetHandler = (e) => {
            e.preventDefault();
            resetState();
        };

        resetBtn.addEventListener('click', resetHandler);
        resetBtn.addEventListener('touchend', resetHandler, { passive: false });

        // Bootstrap the app
        init();
    </script>
</body>
</html>
